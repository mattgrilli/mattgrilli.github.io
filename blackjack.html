<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt's Blackjack</title>
    <meta name="theme-color" content="#0a4a2c">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a4a2c'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='%23ffd54a'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container" data-phase="betting">
        <div id="top-bar">
            <h1>Matt's Blackjack</h1>
            <div id="game-info">
                <div id="stats-bar">
                    <div id="balance">Balance: $1000</div>
                    <div id="bet">Bet: $0</div>
                </div>
                <div id="shoe-container" title="Cards left in the shoe">
                    <div id="shoe">
                        <div id="shoe-fill"></div>
                    </div>
                    <div id="cards-remaining">312 cards</div>
                </div>
            </div>
            <div id="top-buttons">
                <button id="mute">Sound: On</button>
                <button id="change-theme">Change Theme</button>
            </div>
        </div>

        <div id="message" role="status" aria-live="polite"></div>

        <div id="dealer-hand">
            <div class="hand-title"><span class="hand-name">Dealer's Hand</span><span class="score" hidden></span></div>
            <div id="dealer-cards"></div>
        </div>

        <!-- The player's spot on the felt: the betting circle while betting, the hands once dealt -->
        <div id="player-hands-container">
            <div id="bet-display">
                <div id="bet-label">Place your bet</div>
                <div id="bet-chips"></div>
            </div>
            <div id="player-hands"></div>
        </div>

        <!-- One control dock; only the panel for the current phase is shown (see data-phase) -->
        <div id="dock">
            <div id="bet-dock" class="dock-panel">
                <div id="chip-container"></div>
                <div id="bet-controls">
                    <button id="clear-bet">Clear Bet</button>
                    <button id="rebet">Rebet</button>
                    <input type="number" id="bet-amount" min="1" step="1" inputmode="numeric" placeholder="Amount" aria-label="Bet amount in dollars">
                    <button id="set-bet">Set Bet</button>
                    <button id="deal">Deal</button>
                </div>
            </div>
            <div id="play-dock" class="dock-panel">
                <div id="actions">
                    <button id="hit">Hit</button>
                    <button id="stand">Stand</button>
                    <button id="double">Double Down</button>
                    <button id="split">Split</button>
                    <button id="surrender">Surrender</button>
                    <button id="insurance">Insurance</button>
                    <button id="decline-insurance">No Insurance</button>
                    <button id="hint">Hint</button>
                </div>
            </div>
            <div id="end-dock" class="dock-panel">
                <button id="next-hand">Next Hand</button>
                <button id="restart">New Game ($1000)</button>
            </div>
        </div>

        <div id="stats"></div>
    </div>
    <script src="engine.js"></script>
    <script src="script.js"></script>
</body>
</html>
